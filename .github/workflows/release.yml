
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.1)"
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # ---------- Windows .exe ----------
  windows:
    name: Build Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: birds
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Zip build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath birds-windows-${{ env.TAG }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: birds/birds-windows-${{ env.TAG }}.zip

  # ---------- Android .apk ----------
  android:
    name: Build Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: birds
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk birds-android-${{ env.TAG }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: birds/birds-android-${{ env.TAG }}.apk

  # ---------- Flutter Web ----------
  web:
    name: Build Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: birds
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href /birds/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Web artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: birds/build/web

  # ---------- Deploy Web to GitHub Pages ----------
  deploy-web:
    name: Deploy Web to GitHub Pages
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------- GitHub Release ----------
  release:
    name: Publish release
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Birds ${{ env.TAG }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.apk
