name: birds
description: "Birds library and detection by voice."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# Application version: 1.0.1, Android versionCode: 2.
version: 1.0.1+2

environment:
  sdk: ^3.13.4

# Dependencies specify other packages that your package may depend on.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the package version numbers below to
# the latest versions available on pub.dev.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  just_audio: ^0.10.6
  just_audio_windows: ^0.2.3
  record: ^7.1.2
  flutter_secure_storage: ^11.2.0
  flutter_cache_manager: ^3.4.1
  cached_network_image: ^4.0.7
  crypto: ^3.0.6
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/bird_logo.jpg"

flutter:
  uses-material-design: true
